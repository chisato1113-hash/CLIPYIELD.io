<script src="assets/column.js"></script>
<script>
(function(){
 /* Design Language: monochrome graphite covers + one Yield-orange accent (no rainbow/purple). */
 var GRAD = ['linear-gradient(135deg,#0B0D0F,#2C333C)','linear-gradient(135deg,#14181C,#33231A)',
 'linear-gradient(135deg,#FA6216,#C24A0E)','linear-gradient(135deg,#1A1F26,#434C59)',
 'linear-gradient(135deg,#0E1420,#3B455A)','linear-gradient(135deg,#222831,#3B455A)'];
 function gradFor(s){ var h=0; s=s||''; for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return GRAD[h%GRAD.length]; }
 function esc(s){ return CYColumn.esc(s); }
 function dateStr(iso){ if(!iso) return ''; var d=new Date(iso); return d.getFullYear()+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+('0'+d.getDate()).slice(-2); }

 var cat = 'all';
 function renderCats(){
 var counts = CYColumn.categories();
 var total = CYColumn.published().length;
 var html = '<button class="col-cat'+(cat==='all'?' on':'')+'" data-c="all">すべて <span style="opacity:.6">'+total+'</span></button>';
 Object.keys(counts).forEach(function(c){
 html += '<button class="col-cat'+(cat===c?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)+' <span style="opacity:.6">'+counts[c]+'</span></button>';
 });
 var el = document.getElementById('cats');
 el.innerHTML = html;
 el.querySelectorAll('[data-c]').forEach(function(b){
 b.addEventListener('click', function(){ cat=b.getAttribute('data-c'); renderCats(); renderGrid(); });
 });
 }
 function cover(a){
 if (a.coverImage) return '<div class="post-cover" style="background-image:url('+JSON.stringify(a.coverImage)+')"><span class="cat">'+esc(a.category)+'</span></div>';
 return '<div class="post-cover" style="background:'+gradFor(a.category+a.title)+'"><span class="cat">'+esc(a.category)+'</span><span class="ph">'+esc(a.category)+'</span></div>';
 }
 function renderGrid(){
 var items = CYColumn.published({category:cat});
 var grid = document.getElementById('grid');
 if (!items.length){ grid.innerHTML = '<div class="cd-empty" style="grid-column:1/-1"><div class="big"></div>このカテゴリーの記事はまだありません。</div>'; return; }
 grid.innerHTML = items.map(function(a){
 return '<a class="post-card" href="article.html?slug='+encodeURIComponent(a.slug)+'">'+
 cover(a)+
 '<div class="post-body">'+
 '<h2>'+esc(a.title)+'</h2>'+
 '<p class="ex">'+esc(a.excerpt||'')+'</p>'+
 '<div class="meta"><span>'+esc(a.author||'CLIPYIELD編集部')+'</span><span class="dot"></span>'+
 '<time datetime="'+esc(a.publishedAt||'')+'">'+dateStr(a.publishedAt)+'</time><span class="dot"></span>'+
 '<span>'+CYColumn.readingMinutes(a.body)+'分</span></div>'+
 '</div></a>';
 }).join('');
 }
 renderCats(); renderGrid();
})();
</script>
