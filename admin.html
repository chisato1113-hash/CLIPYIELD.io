<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta name="robots" content="noindex,nofollow"/>
<title>コラム管理 — CLIPYIELD Admin</title>
<link rel="stylesheet" href="assets/cy.css"/>
</head>
<body class="adm-shell">
<div class="note-bar"><div class="wrap"><b>社内デザイン確認用プロトタイプ</b>｜運営管理画面。記事はこのブラウザ内（localStorage）に保存されます（デモ）。</div></div>

<nav class="nav">
 <div class="wrap nav-in">
 <a class="logo" href="index.html">
 <svg fill="none" height="26" viewBox="0 0 32 32" width="26">
 <defs><linearGradient id="lg" x1="0" x2="32" y1="0" y2="32"><stop offset="0" stop-color="#FA6216"></stop><stop offset="1" stop-color="#FA6216"></stop></linearGradient></defs>
 <rect height="30" rx="9" stroke="url(#lg)" stroke-width="2" width="30" x="1" y="1"></rect>
 <path d="M12 9.5 L22.5 16 L12 22.5 Z" fill="url(#lg)"></path>
 <path d="M8 12.5 L8 19.5" stroke="url(#lg)" stroke-linecap="round" stroke-width="2.4"></path>
 </svg>
 CLIPYIELD <span style="font-size:12px;color:var(--ink-3);font-weight:700;margin-left:4px">Admin</span>
 </a>
 <div class="nav-cta">
 <a class="btn btn-ghost btn-sm" href="column.html" target="_blank">コラムを見る ↗</a>
 <span class="nav-user"><span class="av" id="avatar">A</span><span id="adminName">—</span></span>
 <button class="btn btn-ghost btn-sm" id="logout" type="button">ログアウト</button>
 </div>
 </div>
</nav>

<header class="sub-head">
 <div class="adm-body" style="padding-top:0;padding-bottom:0">
 <div class="hi">コラム管理</div>
 <div class="sub">クリッパー募集用のSEOコラム記事を作成・編集・公開します。</div>
 </div>
</header>

<div class="adm-body">
 <div class="adm-cols">

 <!-- LEFT: list + AI -->
 <div>
 <div class="ai-panel">
 <h4>SEO記事作成AI（下書き生成）</h4>
 <p>キーワード／トピックから下書きを自動生成します。現在はローカルのテンプレ生成（デモ）。本番はSEO記事作成AIのAPI/連携に差し替え、生成→レビュー→公開のフローを自動化できます。</p>
 <div class="ai-row">
 <input id="aiTopic" type="text" placeholder="例：Shortsのサムネで再生数を伸ばす方法"/>
 <button class="btn btn-primary btn-sm" id="aiGen" type="button">生成</button>
 </div>
 </div>

 <div class="adm-list">
 <div class="adm-list-h">
 <h3>記事</h3>
 <div class="adm-tabs" id="tabs">
 <button class="adm-tab on" data-s="all" type="button">すべて</button>
 <button class="adm-tab" data-s="published" type="button">公開</button>
 <button class="adm-tab" data-s="draft" type="button">下書き</button>
 </div>
 </div>
 <div id="list"></div>
 <div style="padding:14px 18px;border-top:1px solid var(--line)">
 <button class="btn btn-ghost btn-sm btn-block" id="newBtn" type="button">＋ 新規作成</button>
 </div>
 </div>
 </div>

 <!-- RIGHT: editor -->
 <div class="adm-edit" id="editor"><!-- rendered --></div>

 </div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/column.js"></script>
<script>
(function(){
 var admin = CYColumn.requireAdmin("admin-login.html");
 if (!admin) return;
 document.getElementById('adminName').textContent = admin.name || admin.id;
 document.getElementById('avatar').textContent = (admin.name || admin.id).charAt(0).toUpperCase();
 document.getElementById('logout').addEventListener('click', function(){ CYColumn.adminLogout(); location.href='admin-login.html'; });

 var $ = function(id){ return document.getElementById(id); };
 var esc = CYColumn.esc;
 var toast = $('toast');
 function showToast(m){ toast.textContent=m; toast.classList.add('on'); setTimeout(function(){ toast.classList.remove('on'); },2600); }
 function dateStr(iso){ if(!iso) return '—'; var d=new Date(iso); return d.getFullYear()+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+('0'+d.getDate()).slice(-2); }
 var GRAD=['#22282F','#33231A','#FA6216','#1A1F26','#0E1420','#3B455A'];
 function colorFor(s){ var h=0; s=s||''; for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return GRAD[h%GRAD.length]; }

 var state = { tab:'all', id:null, cover:'' };

 /* ---------- list ---------- */
 function renderList(){
 var items = CYColumn.list(state.tab==='all'?{}:{status:state.tab});
 var el = $('list');
 if (!items.length){ el.innerHTML = '<div style="padding:26px 18px;color:var(--ink-3);font-size:13px;text-align:center">記事がありません。</div>'; return; }
 el.innerHTML = items.map(function(a){
 var badge = a.status==='published'
 ? '<span class="badge badge-pub">公開</span>'
 : '<span class="badge badge-draft">下書き</span>';
 var ai = a.source==='ai' ? ' <span class="badge badge-ai">AI</span>' : '';
 var th = a.coverImage
 ? '<div class="th" style="background-image:url('+JSON.stringify(a.coverImage)+')"></div>'
 : '<div class="th" style="background:'+colorFor(a.category+a.title)+'">'+esc((a.category||'').slice(0,2))+'</div>';
 return '<div class="adm-item'+(a.id===state.id?' sel':'')+'" data-id="'+a.id+'">'+
 th+'<div class="ti"><div class="t">'+esc(a.title)+'</div>'+
 '<div class="s">'+badge+ai+' · '+esc(a.category||'')+' · '+dateStr(a.publishedAt||a.updatedAt)+'</div></div></div>';
 }).join('');
 el.querySelectorAll('[data-id]').forEach(function(it){
 it.addEventListener('click', function(){ loadEditor(CYColumn.getById(it.getAttribute('data-id'))); });
 });
 }

 /* ---------- editor ---------- */
 function loadEditor(a){
 state.id = a ? a.id : null;
 state.cover = a ? (a.coverImage||'') : '';
 var v = a || { title:'', slug:'', category:'ガイド', tags:[], excerpt:'', body:'', author:'CLIPYIELD編集部', seoTitle:'', seoDescription:'', keywords:[], status:'draft', source:'manual' };
 $('editor').innerHTML =
 '<div class="card-h" style="margin-bottom:16px"><h3 style="font-size:15px;font-weight:800">'+(a?'記事を編集':'新規記事')+'</h3>'+
 (a?'<span class="s">'+(a.source==='ai'?'AI生成 · ':'')+(a.status==='published'?'公開中':'下書き')+'</span>':'')+'</div>'+
 '<div class="form-err" id="eErr"></div>'+
 field('タイトル','<input id="f-title" type="text" value="'+esc(v.title)+'" placeholder="記事タイトル"/>')+
 '<div class="sub-grid">'+
 field('スラッグ（URL）','<input id="f-slug" type="text" value="'+esc(v.slug)+'" placeholder="自動生成されます"/>')+
 field('カテゴリー','<input id="f-cat" type="text" list="catList" value="'+esc(v.category)+'"/><datalist id="catList"><option>ガイド</option><option>ノウハウ</option><option>著作権</option><option>事例</option><option>お知らせ</option></datalist>')+
 '</div>'+
 field('タグ（カンマ区切り）','<input id="f-tags" type="text" value="'+esc((v.tags||[]).join(', '))+'" placeholder="切り抜き, 副業, 編集"/>')+
 // cover
 '<div class="field"><label>カバー画像</label>'+
 '<input id="f-coverUrl" type="url" value="'+esc(v.coverImage||'')+'" placeholder="画像URL（https://…）"/>'+
 '<label class="cover-drop" id="coverDrop" for="f-coverFile" style="margin-top:10px">クリックまたはドラッグで画像をアップロード（デモは1.5MBまで・base64保存）<input id="f-coverFile" type="file" accept="image/*" style="display:none"/></label>'+
 '<div class="cover-prev" id="coverPrev"></div>'+
 '</div>'+
 field('抜粋（一覧・SEO説明に使用）','<textarea id="f-excerpt" style="min-height:70px">'+esc(v.excerpt||'')+'</textarea>')+
 // body + preview
 '<div class="field"><label>本文（Markdown）<button type="button" id="pvToggle" class="btn btn-ghost btn-sm" style="float:right;padding:4px 12px;font-size:11px">プレビュー</button></label>'+
 '<textarea id="f-body" class="body" placeholder="## 見出し&#10;本文…（Markdown対応：# 見出し / **太字** / - リスト / [link](url) / ![alt](url) / &gt; 引用）">'+esc(v.body||'')+'</textarea>'+
 '<div class="md-preview" id="pv" style="display:none;margin-top:10px"></div>'+
 '</div>'+
 '<div style="border-top:1px solid var(--line);margin:20px 0 16px;padding-top:16px"><div style="font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase;margin-bottom:12px">SEO設定</div>'+
 field('SEOタイトル（未入力ならタイトルを使用）','<input id="f-seoTitle" type="text" value="'+esc(v.seoTitle||'')+'"/>')+
 field('メタディスクリプション','<textarea id="f-seoDesc" style="min-height:64px">'+esc(v.seoDescription||'')+'</textarea>')+
 field('キーワード（カンマ区切り）','<input id="f-keywords" type="text" value="'+esc((v.keywords||[]).join(', '))+'"/>')+
 '</div>'+
 // actions
 '<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;border-top:1px solid var(--line);padding-top:16px">'+
 (a?'<button class="btn btn-ghost btn-sm" id="delBtn" type="button" style="margin-right:auto;color:var(--danger)">削除</button>':'')+
 '<button class="btn btn-ghost btn-sm" id="previewBtn" type="button">プレビュー ↗</button>'+
 '<button class="btn btn-ghost btn-sm" id="saveBtn" type="button">下書き保存</button>'+
 (v.status==='published'
 ? '<button class="btn btn-ghost btn-sm" id="unpubBtn" type="button">非公開に戻す</button>'
 : '')+
 '<button class="btn btn-primary btn-sm" id="pubBtn" type="button">'+(v.status==='published'?'更新して公開':'公開する')+'</button>'+
 '</div>';

 // cover preview
 updateCoverPrev(state.cover || v.coverImage || '');
 $('f-coverUrl').addEventListener('input', function(){ state.cover=this.value.trim(); updateCoverPrev(state.cover); });
 var fileInput = $('f-coverFile'), drop = $('coverDrop');
 fileInput.addEventListener('change', function(){ handleCoverFile(this.files[0]); });
 ['dragover','dragleave','drop'].forEach(function(ev){
 drop.addEventListener(ev, function(e){ e.preventDefault(); if(ev==='drop') handleCoverFile(e.dataTransfer.files[0]); });
 });
 // slug auto from title (only if slug empty)
 $('f-title').addEventListener('input', function(){
 if (!$('f-slug').value.trim()) $('f-slug').setAttribute('placeholder', CYColumn.slugify(this.value)||'自動生成されます');
 });
 // preview toggle
 var pvOn=false;
 $('pvToggle').addEventListener('click', function(){
 pvOn=!pvOn; $('pv').style.display=pvOn?'block':'none'; this.textContent=pvOn?'編集に戻る':'プレビュー';
 if(pvOn) $('pv').innerHTML='<div class="art-body">'+CYColumn.mdToHtml($('f-body').value)+'</div>';
 });
 $('f-body').addEventListener('input', function(){ if(pvOn) $('pv').innerHTML='<div class="art-body">'+CYColumn.mdToHtml(this.value)+'</div>'; });

 // actions
 $('saveBtn').addEventListener('click', function(){ doSave('draft'); });
 $('pubBtn').addEventListener('click', function(){ doSave('published'); });
 if ($('unpubBtn')) $('unpubBtn').addEventListener('click', function(){ if(state.id){ CYColumn.unpublish(state.id); showToast('非公開にしました'); refresh(); } });
 if ($('delBtn')) $('delBtn').addEventListener('click', function(){ if(state.id){ CYColumn.remove(state.id); showToast('削除しました'); state.id=null; refresh(true); } });
 $('previewBtn').addEventListener('click', function(){ var s=doSave('keep',true); if(s) window.open('article.html?slug='+encodeURIComponent(s.slug)+'&preview=1','_blank'); });

 renderList();
 }

 function field(label, inner){ return '<div class="field"><label>'+label+'</label>'+inner+'</div>'; }

 function handleCoverFile(file){
 if(!file) return;
 if(file.size > 1.5*1024*1024){ showToast('画像は1.5MBまでにしてください（デモ制限）'); return; }
 var r=new FileReader(); r.onload=function(){ state.cover=r.result; $('f-coverUrl').value=''; updateCoverPrev(state.cover); }; r.readAsDataURL(file);
 }
 function updateCoverPrev(src){
 var p=$('coverPrev'), d=$('coverDrop');
 if(src){ p.style.backgroundImage='url('+JSON.stringify(src)+')'; p.classList.add('on'); if(d) d.classList.add('filled'); }
 else { p.classList.remove('on'); if(d) d.classList.remove('filled'); }
 }

 function splitList(s){ return (s||'').split(',').map(function(x){return x.trim();}).filter(Boolean); }

 // status: 'draft' | 'published' | 'keep'. returns saved article (or null on error)
 function doSave(status, quiet){
 var title = $('f-title').value.trim();
 if(!title){ eerr('タイトルを入力してください。'); return null; }
 var data = {
 id: state.id || undefined,
 title: title,
 slug: $('f-slug').value.trim() || CYColumn.slugify(title),
 category: $('f-cat').value.trim() || 'ガイド',
 tags: splitList($('f-tags').value),
 coverImage: state.cover || '',
 excerpt: $('f-excerpt').value.trim(),
 body: $('f-body').value,
 seoTitle: $('f-seoTitle').value.trim(),
 seoDescription: $('f-seoDesc').value.trim(),
 keywords: splitList($('f-keywords').value)
 };
 if(status==='keep'){ data.status = state.id ? CYColumn.getById(state.id).status : 'draft'; }
 else data.status = status;

 var saved = state.id ? CYColumn.save(data) : CYColumn.createDraft(data);
 state.id = saved.id;
 if(!quiet) showToast(status==='published'?'公開しました':'保存しました');
 renderList();
 // refresh status-dependent buttons by reloading editor
 loadEditor(saved);
 return saved;
 }
 function eerr(m){ var e=$('eErr'); if(e){ e.textContent=m; e.classList.add('on'); } }

 function refresh(clear){ renderList(); if(clear) loadEditor(null); else if(state.id) loadEditor(CYColumn.getById(state.id)); else loadEditor(null); }

 /* ---------- tabs / new / AI ---------- */
 $('tabs').querySelectorAll('[data-s]').forEach(function(b){
 b.addEventListener('click', function(){ state.tab=b.getAttribute('data-s'); $('tabs').querySelectorAll('[data-s]').forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); renderList(); });
 });
 $('newBtn').addEventListener('click', function(){ loadEditor(null); });
 $('aiGen').addEventListener('click', function(){
 var topic = $('aiTopic').value.trim();
 if(!topic){ showToast('トピック／キーワードを入力してください'); $('aiTopic').focus(); return; }
 var draft = CYColumn.ai.createDraft(topic); // <- same seam an automated pipeline uses
 $('aiTopic').value='';
 state.tab='draft'; $('tabs').querySelectorAll('[data-s]').forEach(function(x){x.classList.toggle('on', x.getAttribute('data-s')==='draft');});
 showToast('AI下書きを生成しました。内容を確認して公開してください。');
 loadEditor(draft);
 });

 // init
 renderList();
 var first = CYColumn.list({})[0];
 loadEditor(first || null);
})();
</script>
</body>
</html>
