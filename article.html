<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>記事 — CLIPYIELD クリッパーコラム</title>
<meta name="description" id="metaDesc" content="CLIPYIELD クリッパーコラムの記事です。"/>
<link rel="stylesheet" href="assets/cy.css"/>
</head>
<body>
<div class="note-bar"><div class="wrap"><b>社内デザイン確認用プロトタイプ</b>｜記事は運営管理画面から追加・編集できます（デモはブラウザ内に保存）。</div></div>

<nav class="nav">
 <div class="wrap nav-in">
 <a class="logo" href="index.html">
 <svg fill="none" height="26" viewBox="0 0 32 32" width="26">
 <defs><linearGradient id="lg" x1="0" x2="32" y1="0" y2="32"><stop offset="0" stop-color="#FA6216"></stop><stop offset="1" stop-color="#FA6216"></stop></linearGradient></defs>
 <rect height="30" rx="9" stroke="url(#lg)" stroke-width="2" width="30" x="1" y="1"></rect>
 <path d="M12 9.5 L22.5 16 L12 22.5 Z" fill="url(#lg)"></path>
 <path d="M8 12.5 L8 19.5" stroke="url(#lg)" stroke-linecap="round" stroke-width="2.4"></path>
 </svg>
 CLIPYIELD
 </a>
 <div class="nav-cta">
 <a class="btn btn-ghost btn-sm" href="column.html">コラム一覧</a>
 <a class="btn btn-primary btn-sm" href="signup.html">無料ではじめる</a>
 </div>
 </div>
</nav>

<article class="art-wrap" id="art"><!-- rendered --></article>

<footer class="app-foot">
 <div class="wrap">© 2026 CLIPYIELD ／ 株式会社Z-IP｜社内デザイン確認用プロトタイプ・掲載内容はサンプルです</div>
</footer>

<script src="assets/column.js"></script>
<script>
(function(){
 var GRAD = ['linear-gradient(135deg,#0B0D0F,#2C333C)','linear-gradient(135deg,#14181C,#33231A)',
 'linear-gradient(135deg,#FA6216,#C24A0E)','linear-gradient(135deg,#1A1F26,#434C59)',
 'linear-gradient(135deg,#0E1420,#3B455A)','linear-gradient(135deg,#222831,#3B455A)'];
 function gradFor(s){ var h=0; s=s||''; for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return GRAD[h%GRAD.length]; }
 var esc = CYColumn.esc;
 function dateStr(iso){ if(!iso) return ''; var d=new Date(iso); return d.getFullYear()+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+('0'+d.getDate()).slice(-2); }
 function param(k){ return new URLSearchParams(location.search).get(k); }

 function setMeta(name, val, attr){
 attr = attr || 'name';
 var el = document.head.querySelector('meta['+attr+'="'+name+'"]');
 if (!el){ el = document.createElement('meta'); el.setAttribute(attr, name); document.head.appendChild(el); }
 el.setAttribute('content', val);
 }
 function injectSeo(a){
 var title = (a.seoTitle || a.title) ;
 document.title = title.indexOf('CLIPYIELD')>=0 ? title : (title + ' — CLIPYIELD');
 var desc = a.seoDescription || a.excerpt || '';
 document.getElementById('metaDesc').setAttribute('content', desc);
 // OGP / Twitter
 setMeta('og:type','article','property');
 setMeta('og:title', a.title, 'property');
 setMeta('og:description', desc, 'property');
 setMeta('og:site_name','CLIPYIELD','property');
 if (a.coverImage) setMeta('og:image', a.coverImage, 'property');
 setMeta('twitter:card','summary_large_image');
 if (a.keywords && a.keywords.length) setMeta('keywords', a.keywords.join(','));
 // canonical
 var can = document.head.querySelector('link[rel=canonical]') || (function(){ var l=document.createElement('link'); l.rel='canonical'; document.head.appendChild(l); return l; })();
 can.href = location.origin + location.pathname + '?slug=' + encodeURIComponent(a.slug);
 // JSON-LD: BlogPosting + BreadcrumbList
 var ld = {
 "@context":"https://schema.org","@type":"BlogPosting",
 "headline": a.title, "description": desc,
 "datePublished": a.publishedAt || a.createdAt, "dateModified": a.updatedAt || a.publishedAt,
 "author": {"@type": a.source==='ai'?"Organization":"Person","name": a.author||"CLIPYIELD編集部"},
 "publisher": {"@type":"Organization","name":"株式会社Z-IP","brand":"CLIPYIELD"},
 "keywords": (a.keywords||[]).join(","),
 "articleSection": a.category, "inLanguage":"ja"
 };
 if (a.coverImage) ld.image = a.coverImage;
 var crumb = {
 "@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[
 {"@type":"ListItem","position":1,"name":"ホーム","item": location.origin + "/index.html"},
 {"@type":"ListItem","position":2,"name":"コラム","item": location.origin + "/column.html"},
 {"@type":"ListItem","position":3,"name": a.title}
 ]
 };
 [ld, crumb].forEach(function(obj){
 var s = document.createElement('script'); s.type='application/ld+json'; s.textContent = JSON.stringify(obj); document.head.appendChild(s);
 });
 }

 function related(a){
 var others = CYColumn.published().filter(function(x){ return x.id!==a.id; });
 // prefer same category
 others.sort(function(x,y){ return (y.category===a.category)-(x.category===a.category); });
 return others.slice(0,3);
 }

 var slug = param('slug');
 var isPreview = param('preview') === '1'; // admin draft preview
 var a = slug ? CYColumn.getBySlug(slug) : null;
 var wrap = document.getElementById('art');

 if (!a || (a.status !== 'published' && !isPreview)){
 wrap.innerHTML = '<div class="cd-empty"><div class="big"></div>記事が見つかりませんでした。<div style="margin-top:16px"><a class="btn btn-primary btn-sm" href="column.html">コラム一覧へ</a></div></div>';
 document.title = '記事が見つかりません — CLIPYIELD';
 return;
 }
 injectSeo(a);

 var coverHtml = a.coverImage
 ? '<div class="art-cover" style="background-image:url('+JSON.stringify(a.coverImage)+')"></div>'
 : '<div class="art-cover" style="background:'+gradFor(a.category+a.title)+'">'+esc(a.category)+'</div>';

 var rel = related(a);
 wrap.innerHTML =
 (isPreview && a.status!=='published' ? '<div class="pay-warn" style="margin-bottom:18px">これは<b>下書きのプレビュー</b>です（未公開）。公開すると一般に表示されます。</div>' : '')+
 '<nav class="breadcrumb"><a href="index.html">ホーム</a> › <a href="column.html">コラム</a> › '+esc(a.category)+'</nav>'+
 '<div class="art-head"><h1>'+esc(a.title)+'</h1>'+
 '<div class="art-meta"><span class="cat">'+esc(a.category)+'</span>'+
 '<span>'+esc(a.author||'CLIPYIELD編集部')+'</span>·'+
 '<time datetime="'+esc(a.publishedAt||'')+'">'+dateStr(a.publishedAt)+'</time>·'+
 '<span>約'+CYColumn.readingMinutes(a.body)+'分で読めます</span>'+
 (a.source==='ai'?'<span class="badge badge-ai" style="margin-left:4px">AI生成</span>':'')+
 '</div></div>'+
 coverHtml+
 '<div class="art-body">'+CYColumn.mdToHtml(a.body)+'</div>'+
 (a.tags&&a.tags.length? '<div class="art-tags">'+a.tags.map(function(t){return '<span>#'+esc(t)+'</span>';}).join('')+'</div>':'')+
 '<div class="art-cta"><h3>公式ライセンス素材で、著作権を気にせず切り抜き。</h3>'+
 '<p>審査を通過した公式切り抜き師のみが案件を受けられます。審査ではフォロワー数より編集の質・権利意識・実績を重視します。</p>'+
 '<a class="btn btn-primary" href="signup.html">無料ではじめる</a></div>'+
 (rel.length? '<h2 style="font-size:18px;font-weight:800;margin:10px 0 16px">関連記事</h2>'+
 '<div class="col-grid" style="margin-top:0">'+rel.map(function(r){
 var cov = r.coverImage
 ? '<div class="post-cover" style="background-image:url('+JSON.stringify(r.coverImage)+')"><span class="cat">'+esc(r.category)+'</span></div>'
 : '<div class="post-cover" style="background:'+gradFor(r.category+r.title)+'"><span class="cat">'+esc(r.category)+'</span><span class="ph">'+esc(r.category)+'</span></div>';
 return '<a class="post-card" href="article.html?slug='+encodeURIComponent(r.slug)+'">'+cov+
 '<div class="post-body"><h3>'+esc(r.title)+'</h3><p class="ex">'+esc(r.excerpt||'')+'</p></div></a>';
 }).join('')+'</div>' : '');
})();
</script>
</body>
</html>
